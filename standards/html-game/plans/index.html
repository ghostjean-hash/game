<!DOCTYPE html>
<!-- ai-tell-exempt: 사용자 결정 2026-07-30 - 회인무격 기획서 스타일·목차 셸을 게임 허브 기획서 표준으로 채택. 글로벌 뼈대 스킬 대신 이 셸이 목차·임베드·폭 저장을 담당한다. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>게임 허브 기획서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Poppins:wght@400;500;600&family=Noto+Serif:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{--sheet:#FFFFFF;--sheet-2:#F5F6F7;--ink:#17191C;--ink-2:#43484E;--ink-3:#80868D;
 --rule:#C2C8CF;--seal:#B3372B;--indigo:#1F3A5F;--indigo-soft:#EEF2F7;
 --body:'Noto Sans KR',system-ui,sans-serif;--roman:'Noto Serif','Noto Sans KR',serif;
 --mono:'Poppins','Noto Sans KR',sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:#fff;font-family:var(--body);color:var(--ink);overflow:hidden;letter-spacing:-.002em}
#side{width:270px;flex:0 0 auto;background:#fff;border-right:1px solid var(--rule);overflow-y:auto;padding:28px 0 60px}
#side.hid{display:none}
.brand{padding:0 22px 18px;border-bottom:1px solid var(--rule);margin-bottom:16px}
.brand .t{font-weight:700;font-size:18px;letter-spacing:-.02em}
.brand .s{font-family:var(--mono);font-size:10.5px;color:var(--seal);margin-top:3px}
.nl{display:flex;gap:9px;align-items:baseline;padding:8px 22px;font-size:13.5px;color:var(--ink-2);text-decoration:none;border-left:2px solid transparent}
.nl .vn{font-family:var(--roman);font-weight:700;font-size:13.5px;color:var(--ink-3);flex:0 0 auto;min-width:38px}
.nl:hover{background:var(--sheet-2);color:var(--ink)}
.nl.on{border-left-color:var(--seal);color:var(--ink);background:var(--indigo-soft);font-weight:700}
.nl.on .vn{color:var(--ink)}
.gh{padding:20px 22px 6px;font-size:11px;color:var(--ink-3);border-top:1px solid var(--rule);margin-top:12px;font-family:var(--roman);font-weight:700}
.gh span{font-family:var(--body);font-weight:700;font-size:13px;color:var(--ink);margin-left:8px}
/* 목차 폭 손잡이. 폭은 6px이지만 ::after로 좌우 5px씩 넓혀 잡기 쉽게 한다. */
#rz{width:6px;flex:0 0 auto;cursor:col-resize;background:transparent;position:relative;z-index:20}
#rz:hover,#rz.drag{background:var(--rule)}
#rz::after{content:'';position:absolute;top:0;bottom:0;left:-5px;right:-5px}
#main{flex:1;min-width:0}
#fr{width:100%;height:100%;border:0;display:block;background:#fff}
#tog{position:fixed;left:10px;bottom:10px;z-index:30;background:#fff;border:1px solid var(--rule);border-radius:2px;
 font-family:var(--body);font-size:12px;padding:6px 11px;cursor:pointer;color:var(--ink-2)}
#tog:hover{color:var(--ink);border-color:var(--ink)}
</style>
</head>
<body>
<nav id="side">
  <div class="brand"><div class="t">게임 허브</div><div class="s">기획서 · r1.0</div></div>
</nav>
<div id="rz" title="목차 폭 조절"></div>
<main id="main"><iframe id="fr" title="기획서 본문"></iframe></main>
<button id="tog">목차</button>
<script src="nav.js"></script>
<script>
(function(){
  var side=document.getElementById('side'), fr=document.getElementById('fr');
  function leaf(n){
    var a=document.createElement('a'); a.className='nl'; a.href='#'+n.id;
    a.innerHTML='<span class="vn">'+n.vol+'.</span><span>'+n.label+'</span>';
    a.dataset.id=n.id;
    a.addEventListener('click',function(e){ e.preventDefault(); go(n.id); });
    return a;
  }
  function find(id){ var hit=null; (function walk(a){ a.forEach(function(n){ if(n.id===id) hit=n; if(n.children) walk(n.children); }); })(window.GDD_NAV); return hit; }
  function go(id){
    var n=find(id); if(!n) return;
    fr.setAttribute('src', n.file);
    localStorage.setItem('ghub.gdd.cur', id);
    side.querySelectorAll('.nl').forEach(function(a){ a.classList.toggle('on', a.dataset.id===id); });
  }
  window.GDD_NAV.forEach(function(n){
    if(n.group){
      var h=document.createElement('div'); h.className='gh';
      h.innerHTML=n.vol+'.<span>'+n.label+'</span>';
      side.appendChild(h);
      n.children.forEach(function(c){ side.appendChild(leaf(c)); });
    } else side.appendChild(leaf(n));
  });
  go(localStorage.getItem('ghub.gdd.cur') || window.GDD_NAV[0].id);

  // 목차 폭 조절. 본문이 별도 화면(iframe)이라 커서가 그 위로 들어가면 부모가 마우스 움직임을
  // 더 받지 못한다. 그래서 (1) 손잡이에 포인터를 붙들어 두고(setPointerCapture)
  // (2) 끄는 동안 본문이 마우스를 먹지 않게 막는다. 둘 중 하나만 빠지면 드래그가 중간에 끊긴다.
  var rz=document.getElementById('rz'), drag=false;
  var w=parseInt(localStorage.getItem('ghub.gdd.w'),10);
  function setW(x){
    x=Math.min(460,Math.max(190,Math.round(x)));
    side.style.width=x+'px';
    localStorage.setItem('ghub.gdd.w',x);
  }
  if(!isNaN(w)) setW(w);
  rz.addEventListener('pointerdown',function(e){
    drag=true;
    try{ rz.setPointerCapture(e.pointerId); }catch(_){}
    fr.style.pointerEvents='none';
    document.body.style.userSelect='none';
    rz.classList.add('drag');
    e.preventDefault();
  });
  rz.addEventListener('pointermove',function(e){ if(drag) setW(e.clientX); });
  function endDrag(e){
    if(!drag) return;
    drag=false;
    try{ rz.releasePointerCapture(e.pointerId); }catch(_){}
    fr.style.pointerEvents='';
    document.body.style.userSelect='';
    rz.classList.remove('drag');
  }
  rz.addEventListener('pointerup',endDrag);
  rz.addEventListener('pointercancel',endDrag);
  var tog=document.getElementById('tog');
  if(localStorage.getItem('ghub.gdd.hid')==='1') side.classList.add('hid');
  tog.addEventListener('click',function(){ side.classList.toggle('hid'); localStorage.setItem('ghub.gdd.hid', side.classList.contains('hid')?'1':'0'); });
})();
</script>
</body>
</html>
