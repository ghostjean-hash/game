<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>시작 흐름 공용 프레임 · 확인용</title>
<link rel="icon" href="data:,"><!-- 확인용 페이지라 아이콘이 없다. 없으면 콘솔에 404가 남아 진짜 오류와 섞인다 -->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../mobile-shell.css">
<link rel="stylesheet" href="./frame.css">
<style>
  /* 부품 확인 줄. 실제 게임이라면 이 자리를 게임이 정한다(규칙 19 - 자리는 게임 몫). */
  .demo-parts { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 5; }
</style>
<style>
  /* 이 페이지는 게임이 아니라 부품 확인용이다. 실제 게임에는 아래 스타일이 없다. */
  body { margin: 0; }
  #app { position: fixed; inset: 0; }
  /* 배경 그림이 없는 게임이 게임 자체 요소로 배경을 대신하는 경우를 흉내 낸다 */
  .demo-grid {
    position: absolute; left: 22px; right: 22px; top: 32%;
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; opacity: .42;
  }
  .demo-grid i { aspect-ratio: 1; border-radius: 3px; background: var(--c3, #7cf3c4); }
  .demo-grid i.e { visibility: hidden; }
  .demo-plain { background: radial-gradient(130% 78% at 50% 6%, #10382f 0%, #08111c 66%); }
  .demo-play {
    display: grid; place-items: center; height: 100%;
    font-size: 15px; color: var(--fg-dim);
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createGameFrame, SCREEN } from './index.js';

const q = new URLSearchParams(location.search);
const type = q.get('type') || 'simple';       // simple | branch | select
const screen = q.get('screen') || '';         // pause | result | open

// 배경 대용 - 실제 게임에서는 그 게임의 화면 요소가 들어온다.
function decoGrid() {
  const g = document.createElement('div');
  g.className = 'demo-grid';
  const pattern = '0110110110 1111011111 0111111110 1101111011 0111111110 0011111100 0001111000';
  pattern.split(' ').forEach((row) => {
    row.split('').forEach((c) => {
      const i = document.createElement('i');
      if (c === '0') i.className = 'e';
      g.appendChild(i);
    });
  });
  return g;
}

const COMMON = {
  root: document.getElementById('app'),
  gameId: 'frame-demo',
  hubHref: '../../',
  background: { className: 'demo-plain', el: decoGrid() },
};

let frame;
if (type === 'branch') {
  // 갈래 시작형 - 모드마다 기록이 따로 남는 게임. 카드를 펼치지 않고 한 칸으로 접는다.
  frame = createGameFrame({
    ...COMMON,
    title: 'Tetris',
    tagline: '라인을 지워라',
    choices: {
      label: '모드',
      selectedId: 'marathon',
      openFirstVisit: screen === 'open',
      items: [
        { id: 'kids', name: '배움', note: '천천히. 몇 칸 더 채울까?', record: '최고 4,200' },
        { id: 'marathon', name: '마라톤', note: '라인을 지워라. 끝까지.', record: '최고 38,900' },
        { id: 'zen', name: '젠', note: '가속 없음. 호흡대로.', record: '최고 12,050' },
        { id: 'sprint', name: '스프린트', note: '40라인. 최단 시간.', record: '최단 1분 52초' },
      ],
    },
  });
} else if (type === 'select') {
  // 골라 들어가는 형 - 시작을 누르면 판 고르는 화면이 한 칸 들어간다.
  frame = createGameFrame({
    ...COMMON,
    title: '노노그램',
    hasSelect: true,
    resume: { enabled: true, detail: '중급 · 금붕어' },
    startHint: '누르면 그림 고르는 지도로 감',
    extras: [{ id: 'album', label: '도감' }],
  });
  frame.title.setRecord('완성한 그림 128 / 344 · 모은 별 291');
  frame.selectEl.innerHTML = '<div class="demo-play">판 고르는 화면 자리</div>';
} else {
  // 바로 시작형 - 옵션이 셋 이하라 시작 바로 위에 한 줄로 노출한다.
  frame = createGameFrame({
    ...COMMON,
    title: '바푸리의 모험',
    resume: { enabled: true, detail: '12구역 도쿄' },
    options: {
      selectedId: 'normal',
      items: [
        { id: 'easy', name: '쉬움' },
        { id: 'normal', name: '보통' },
        { id: 'hard', name: '어려움' },
      ],
    },
  });
  frame.title.setRecord('최고 점수 128,400 · 가장 멀리 간 곳 파리');
}

frame.playEl.innerHTML = '<div class="demo-play">플레이 화면 자리</div>';

// 겹치는 층 확인용. 실제 게임에서는 멈춤 버튼이나 판이 끝날 때 이 상태가 된다.
if (screen === 'pause') {
  frame.screens.go(SCREEN.PLAY);
  frame.screens.go(SCREEN.PAUSE);
} else if (screen === 'result') {
  frame.screens.go(SCREEN.PLAY);
  frame.finish({
    title: '한 판 끝',
    lines: [
      { label: '이번 점수', value: '42,180', highlight: true },
      { label: '최고 기록', value: '38,900' },
      { label: '지운 줄', value: '64' },
    ],
    newRecord: true,
  });
}

// ── 부품 넷 확인(Ⅰ권 11.2) ──────────────────────────────
// 환경설정 · 아이콘 버튼 · 덮는 카드 · 알림 쪽지. ?parts=1 로 열면 플레이 화면 위에 세운다.
let vibrateOn = true;
let handId = 'right';
if (new URLSearchParams(location.search).get('parts')) {
  // 게임이 자기 항목을 더하는 경우를 함께 본다. 소리 항목은 공용이 이미 넣어 두었다.
  frame.settings.addItem({
    id: 'vibrate', type: 'toggle', label: '진동',
    get: () => vibrateOn, set: (v) => { vibrateOn = v; },
  });
  frame.settings.addItem({
    id: 'hand', type: 'select', label: '조작 손',
    options: [{ id: 'left', label: '왼손' }, { id: 'right', label: '오른손' }],
    get: () => handId, set: (v) => { handId = v; },
  });

  const bar = document.createElement('div');
  bar.className = 'demo-parts';
  bar.innerHTML = `
    <button type="button" class="gg-ic" data-demo="settings" aria-label="환경설정">⚙</button>
    <button type="button" class="gg-ic gg-ic-lg" data-demo="card" aria-label="덮는 카드">▣</button>
    <button type="button" class="gg-ic is-on" data-demo="toast" aria-label="알림 쪽지">✓</button>`;
  frame.playEl.appendChild(bar);

  bar.addEventListener('click', (e) => {
    const b = e.target.closest('[data-demo]');
    if (!b) return;
    if (b.dataset.demo === 'settings') frame.settings.open();
    if (b.dataset.demo === 'toast') frame.overlay.toast('알림 쪽지 확인');
    if (b.dataset.demo === 'card') {
      const body = document.createElement('p');
      body.className = 'gg-card-line';
      body.textContent = '어느 화면에서든 열리는 덮는 카드. 바깥을 누르거나 되돌아가면 이것만 닫힌다.';
      frame.overlay.openCard({ title: '덮는 카드', bodyEl: body, actions: [{ label: '확인', primary: true }] });
    }
  });

  frame.screens.go(SCREEN.PLAY);
}

globalThis.__frame = frame;   // 확인용
</script>
</body>
</html>
