name: Fetch Market Data

on:
  schedule:
    # 매일 07:30 KST = 전날 22:30 UTC. 미국 장 마감 뒤, 한국 장 열리기 전.
    - cron: '30 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-market
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch market data (10 years, overwrite)
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: node scripts/fetch-market.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add apps/stock-lab/data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(stock-lab): daily market data sync"
            git pull --rebase
            git push
          fi
