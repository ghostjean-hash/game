<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0e0f13" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tetris" />
<link rel="apple-touch-icon" sizes="180x180" href="../../icons/icon-180.png" />
<link rel="manifest" href="app.webmanifest" />
<link rel="stylesheet" href="../../shared/tokens.css" />
<link rel="stylesheet" href="../../shared/base.css" />
<link rel="stylesheet" href="../../shared/frame/frame.css" />
<link rel="stylesheet" href="style.css" />
<title>Tetris - game_ghost</title>
</head>
<body>
<!-- 화면 골격·시작 화면·상단 띠·결과 카드는 공용 프레임이 만든다(html-game 표준 4.8).
     여기에는 플레이 화면만 둔다 - 모드 고르기는 시작 화면의 고르는 칸으로 접혔다. -->
<div class="page tetris" id="app">
  <!-- 플레이 화면. 이 게임은 HUD를 상단 띠에 인라인 흡수해 보드 면적을 지키므로,
       플레이에서만 공용 띠를 감추고 이 띠의 버튼을 프레임에 연결한다(규격 4.8-11). -->
  <div id="game-screen" class="game-screen">
    <div class="topbar">
      <button id="btn-back" class="home" type="button" aria-label="되돌아가기">←</button>
      <h1 class="sr-only">Tetris</h1>
      <div class="score-big" aria-live="polite" aria-label="점수">
        <b id="score">0</b>
      </div>
      <div class="mini-hud" aria-live="polite">
        <span class="mh"><small id="level-label">LV</small><b id="level">1</b></span>
        <span class="mh sep">·</span>
        <span class="mh"><small id="lines-label">L</small><b id="lines">0</b></span>
        <span class="mh sep best-sep">·</span>
        <span class="mh best"><small>★</small><b id="best">0</b></span>
      </div>
      <div class="piece-slot" aria-label="홀드 블록">
        <small>HLD</small>
        <canvas id="hold" class="piece-mini"></canvas>
      </div>
      <div class="piece-slot" aria-label="다음 블록">
        <small>NXT</small>
        <canvas id="next" class="piece-mini"></canvas>
      </div>
      <button id="btn-mute" class="icon-btn" type="button" aria-label="소리 끄기">🔊</button>
      <button id="btn-pause" class="icon-btn" type="button" aria-label="일시정지">⏸</button>
    </div>
    <div class="stage">
      <canvas id="board"></canvas>
    </div>
  </div>
</div>
<script type="module" src="../../shared/cloud/auto.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
