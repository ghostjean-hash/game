<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#372b3e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rush Hour" />
<link rel="apple-touch-icon" sizes="180x180" href="../../icons/icon-180.png" />
<link rel="manifest" href="app.webmanifest" />
<link rel="stylesheet" href="../../shared/tokens.css" />
<link rel="stylesheet" href="../../shared/base.css" />
<link rel="stylesheet" href="../../shared/frame/frame.css" />
<link rel="stylesheet" href="style.css" />
<title>Rush Hour - game_ghost</title>
</head>
<body>
<!-- 시작 화면·상단 띠·잠깐 멈춤·결과 카드는 공용 프레임이 만든다(html-game 표준 4.8).
     예전에는 열면 곧바로 퍼즐이 떴고 상점·진행 맵·소리·설정이 위쪽 아이콘 줄에 있었다.
     지금은 시작 화면이 앞에 서고, 진행 맵은 그 다음 칸, 상점은 시작 화면 조작단 맨 아래 줄이다. -->
<div class="page rushhour" id="app">
 <div id="screen-play">
  <div class="topbar">
    <!-- 되돌아가기·소리·설정·전체화면은 공용 상단 띠가 갖는다. 이 줄에는 놀이 중에 계속
         보고 있어야 하는 값(골드·이동 수)만 남긴다. -->
    <div class="stat"><span class="stat-icon">🪙</span><span class="stat-value" id="gold">0</span></div>
    <div class="stat"><span class="stat-label">이동</span><span class="stat-value" id="moves">0</span></div>
  </div>

  <div class="stage">
    <div class="board-wrap">
      <div class="board-head">
        <div class="board-stage">
          <span class="stage-line"><span class="stage-mode" id="stage-mode">오리지널</span><span class="stage-cap">스테이지</span><span class="stage-num" id="stage-num">1</span></span>
          <span class="stage-diff" id="stage-diff"><i></i><i></i><i></i><i></i><em id="stage-diff-label"></em></span>
        </div>
        <div class="board-timer" id="time" aria-label="남은 시간">0:00</div>
      </div>
      <div class="board" id="board" aria-label="러시아워 보드"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-prev" type="button">‹ 이전</button>
    <button class="btn" id="btn-undo" type="button">되돌리기</button>
    <button class="btn btn-hint" id="btn-hint" type="button">💡 힌트</button>
    <button class="btn" id="btn-reset" type="button">리셋</button>
    <button class="btn" id="btn-next" type="button">다음 ›</button>
  </div>
 </div>

  <div class="modal-backdrop" id="shop" hidden>
    <div class="modal shop-modal">
      <button class="modal-x" id="btn-shop-close" type="button" aria-label="닫기"><svg class="x-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2><svg class="title-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>상점</h2>
      <p class="shop-gold-line">내 골드 <span id="shop-gold">0</span> 🪙</p>
      <div class="shop-body">
        <p class="shop-hint">보드 테마를 골라 적용해요</p>
        <div class="shop-grid" id="shop-themes"></div>
        <p class="shop-hint">포니 머리 장식을 달아요</p>
        <div class="shop-grid" id="shop-accessories"></div>
      </div>
    </div>
  </div>

  <!-- 진행 맵. 퍼즐이 수백 개라 시작 다음 칸에서 고른다(규격 4.8-1 '골라 들어가는 형').
       화면 전환은 공용 프레임이 맡으므로 hidden 속성을 쓰지 않는다. -->
  <div class="modal-backdrop" id="map">
    <div class="modal map-modal">
      <button class="modal-x" id="btn-map-close" type="button" aria-label="닫기"><svg class="x-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2><svg class="title-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>진행 맵</h2>
      <div class="map-tabs" id="map-tabs"></div>
      <p class="map-credit" id="map-credit" hidden></p>
      <p class="map-summary" id="map-summary"></p>
      <div class="map-scroll" id="map-grid"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="settings" hidden>
    <div class="modal settings-modal">
      <button class="modal-x" id="btn-settings-close" type="button" aria-label="닫기"><svg class="x-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2><svg class="title-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.4"/><circle cx="15" cy="17" r="2.4"/></svg>설정</h2>
      <p class="settings-label">블록 캐릭터 · 배경 · 테두리</p>
      <div class="setting-list" id="setting-list"></div>
    </div>
  </div>

  <!-- 결과는 플레이를 덮는 공용 카드가 담는다(규격 4.8-8). 별·수·콤보·골드는 글자만이 아니라
       이 게임의 표현이라 카드 본문에 이 조각을 그대로 넣는다(규격 4.8-13). -->
  <template id="result-body">
    <div class="rush-result">
      <div id="result-stars" class="result-stars"></div>
      <p id="result-text" class="result-sub"></p>
      <p id="result-combo" class="result-combo" hidden></p>
      <div id="result-gold" class="result-gold"></div>
    </div>
  </template>
</div>
<script type="module" src="../../shared/cloud/auto.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
