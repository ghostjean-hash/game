<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#372b3e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rush Hour" />
<link rel="apple-touch-icon" sizes="180x180" href="../../icons/icon-180.png" />
<link rel="manifest" href="app.webmanifest" />
<link rel="stylesheet" href="../../shared/tokens.css" />
<link rel="stylesheet" href="../../shared/base.css" />
<link rel="stylesheet" href="../../shared/frame/frame.css" />
<link rel="stylesheet" href="style.css" />
<title>Rush Hour - game_ghost</title>
</head>
<body>
<!-- 시작 화면·상단 띠·잠깐 멈춤·결과 카드는 공용 프레임이 만든다(html-game 표준 4.8).
     예전에는 열면 곧바로 퍼즐이 떴고 상점·진행 맵·소리·설정이 위쪽 아이콘 줄에 있었다.
     지금은 시작 화면이 앞에 서고, 진행 맵은 그 다음 칸, 상점·꾸미기·환경설정은 시작 화면
     조작단 맨 아래 줄이다. 놀이 중에 쓰는 되돌아가기·소리·환경설정은 보드 위 줄에 둔다. -->
<div class="page rushhour" id="app">
 <div id="screen-play">
  <div class="topbar">
    <!-- 버튼 모양은 공용 부품(gg-ic)을 쓰고 어디에 놓을지만 이 게임이 정한다(표준 4.8 규칙 19).
         예전에는 이 셋을 공용 상단 띠에 맡겼는데 그 띠가 폐기되며 소리·되돌아가기가 통째로
         사라져 있었다(2026-09-05 실측). 놀이 중에 손이 닿아야 하는 것이라 여기에 되돌린다. -->
    <button class="gg-ic" id="btn-back" type="button" aria-label="되돌아가기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="topbar-gap"></div>
    <button class="gg-ic" id="btn-mute" type="button" aria-label="소리">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path class="snd-on" d="M16 9a4 4 0 010 6"/><path class="snd-off" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
    </button>
    <button class="gg-ic" id="btn-play-settings" type="button" aria-label="환경설정">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M4.2 7.5l1.9 1.1M17.9 15.4l1.9 1.1M4.2 16.5l1.9-1.1M17.9 8.6l1.9-1.1"/></svg>
    </button>
  </div>

  <div class="stage">
    <div class="board-wrap">
      <!-- 보드 바로 위 카드 하나. 윗줄은 "지금 어디"(가끔 보는 값), 아랫줄은 놀면서
           번갈아 보는 값 셋(골드·이동·남은 시간)이다. 예전에는 골드·이동이 화면 맨 위에
           있고 시간만 여기 있어 둘이 세로로 300px 떨어져 있었다. -->
      <div class="board-head">
        <div class="head-where">
          <span class="stage-mode" id="stage-mode">오리지널</span>
          <span class="stage-cap">스테이지</span><span class="stage-num" id="stage-num">1</span>
          <span class="stage-diff" id="stage-diff"><i></i><i></i><i></i><i></i><em id="stage-diff-label"></em></span>
        </div>
        <div class="head-play">
          <!-- 잔액은 공용 지갑 부품이 그린다(기획서 Ⅲ권 4.5). 이 게임이 정하는 것은 자리뿐이다. -->
          <div class="stat stat-gold" id="gold-slot"></div>
          <div class="stat"><span class="stat-label">이동</span><span class="stat-value" id="moves">0</span></div>
          <div class="board-timer" id="time" aria-label="남은 시간">0:00</div>
        </div>
      </div>
      <div class="board" id="board" aria-label="러시아워 보드"></div>
    </div>
  </div>

  <!-- 자주 누르는 셋이 엄지가 닿는 줄, 판을 옮기는 둘은 그 아래 곁가지 줄.
       예전에는 다섯이 한 통에 있고 폭 규칙이 없어 눈에 띄는 순서가 실제 중요도와 반대였다. -->
  <div class="controls">
    <div class="ctrl-main">
      <button class="btn" id="btn-undo" type="button">되돌리기</button>
      <button class="btn btn-hint" id="btn-hint" type="button">💡 힌트</button>
      <button class="btn" id="btn-reset" type="button">리셋</button>
    </div>
    <div class="ctrl-move">
      <button class="btn" id="btn-prev" type="button">‹ 이전</button>
      <button class="btn" id="btn-next" type="button">다음 ›</button>
    </div>
  </div>
 </div>

  <!-- 상점·꾸미기 팝업은 공용 상점 화면으로 갔다(기획서 Ⅲ권 4.6 · 4.7). 껍데기·닫기
       버튼·격자·가격 표시를 이 게임이 다시 만들지 않는다 - 시작 화면 추가 항목에 이름이
       스스로 서고, 누르면 공용 덮는 카드가 뜬다. -->

  <!-- 결과는 플레이를 덮는 공용 카드가 담는다(규격 4.8-8). 별·수·콤보·골드는 글자만이 아니라
       이 게임의 표현이라 카드 본문에 이 조각을 그대로 넣는다(규격 4.8-13). -->
  <template id="result-body">
    <div class="rush-result">
      <div id="result-stars" class="result-stars"></div>
      <p id="result-text" class="result-sub"></p>
      <p id="result-combo" class="result-combo" hidden></p>
      <div id="result-gold" class="result-gold"></div>
    </div>
  </template>
</div>
<script type="module" src="../../shared/cloud/auto.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
