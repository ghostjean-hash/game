<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0a0e18" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="바푸리의 모험" />
<link rel="apple-touch-icon" sizes="180x180" href="../../icons/icon-180.png" />
<link rel="icon" href="../../icons/icon-180.png" />
<link rel="manifest" href="app.webmanifest" />
<link rel="stylesheet" href="../../shared/tokens.css" />
<link rel="stylesheet" href="../../shared/base.css" />
<link rel="stylesheet" href="../../shared/frame/frame.css" />
<link rel="stylesheet" href="styles/main.css" />
<title>Bapuri's Flight - game_ghost</title>
</head>
<body>
<!-- 시작 화면·상단 띠·잠깐 멈춤·결과 카드는 공용 프레임이 만든다(html-game 표준 4.8).
     예전에는 이 자리에 이 게임 전용 메뉴 화면이 있었다 - 캐릭터·최고 점수·난이도 세그·
     친구/자동 토글·이어서 하기·시작·환경설정이 모두 공용 시작 화면의 같은 자리로 옮겨졌다. -->
<div class="page shooter" id="app">
  <!-- 환경설정 모달 -->
  <div id="settings-modal" class="settings-modal" hidden>
    <div class="settings-panel" role="dialog" aria-label="환경설정">
      <h2 class="settings-title">환경설정</h2>
      <label class="set-field">
        <span>자동 플레이 실력</span>
        <select id="set-skill">
          <option value="beginner">초보</option>
          <option value="intermediate">중수</option>
          <option value="advanced">고수</option>
          <option value="pro">프로</option>
        </select>
      </label>
      <label class="set-field set-toggle">
        <span>치트 박스 사용</span>
        <input type="checkbox" id="set-cheat" />
      </label>
      <p class="set-note">치트 박스는 게임 화면에서 마우스로 끌어 옮길 수 있습니다.</p>
      <button id="set-close" class="btn btn-primary" type="button">닫기</button>
    </div>
  </div>

  <!-- 게임 화면. HUD를 캔버스 위에 겹쳐 놓은 구조라 이 화면에서는 공용 상단 띠를 감추고
       이 HUD의 버튼을 프레임에 연결한다(규격 4.8-17). -->
  <div id="game-screen" class="game-screen">
    <div class="topbar">
      <button id="game-home" class="home" type="button" aria-label="되돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
      <h1 class="sr-only">Bapuri's Flight</h1>
      <div class="score-big" aria-live="polite" aria-label="점수">
        <b id="score">0</b>
        <span id="city-country" class="city-country"></span>
        <span id="city-slots" class="city-slots" aria-label="도시 글자 슬롯"></span>
      </div>
      <div class="mini-hud" aria-live="polite">
        <span class="mh mh-loc"><small>구역</small><b id="stage">1</b></span>
        <span class="mh sep">·</span>
        <span class="mh row"><i class="pbadge b-P" aria-label="전방 화력"><img src="assets/powerups/front.png" alt="" /></i><b id="front">1</b></span>
        <span class="mh row"><i class="pbadge b-S" aria-label="옵션기"><img src="assets/powerups/side.png" alt="" /></i><b id="option">0</b></span>
        <span class="mh row"><i class="pbadge b-E" aria-label="에너지존"><img src="assets/powerups/zone.png" alt="" /></i><b id="zone">0</b></span>
        <span class="mh row"><i class="pbadge b-T" aria-label="꼬리 비행기"><img src="assets/powerups/tail.png" alt="" /></i><b id="tail">0</b></span>
      </div>
      <div class="lives" id="lives" aria-label="남은 목숨">
        <span class="life"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span><span class="life"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span><span class="life"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span><span class="life" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span><span class="life" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
      </div>
      <button id="btn-auto" class="icon-btn" type="button" aria-label="자동 플레이 켜기" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></button>
      <!-- 소리 버튼은 어느 화면에서든 있어야 한다(규격 4.8-4). 시작 화면에서는 공용 상단 띠가 갖고,
           플레이 화면은 그 띠를 감추므로(4.8-17) 같은 버튼을 여기에 둔다. 동작은 공용 프레임에 연결된다.
           전체화면은 시작 화면에만 둔다 - 플레이 중에 바꿀 일이 드물고, 이 HUD는 이미 가로가 빽빽하다. -->
      <button id="btn-mute" class="icon-btn" type="button" aria-label="소리 끄기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
      <button id="btn-pause" class="icon-btn" type="button" aria-label="잠깐 멈춤"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg></button>
    </div>
    <div class="stage">
      <canvas id="board"></canvas>
      <!-- 보스 체력 바 -->
      <div id="boss-bar" class="boss-bar" hidden>
        <span class="boss-name" id="boss-name">BOSS</span>
        <div class="boss-hp"><i id="boss-hp-fill"></i></div>
      </div>
      <!-- 배너(구역 시작/클리어) -->
      <div id="banner" class="banner" hidden></div>
    </div>
    <!-- 치트 박스(환경설정에서 켜면 표시, 드래그 이동) -->
    <div id="cheat-box" class="cheat-box" hidden>
      <div class="cheat-head" id="cheat-head">
        <span class="cheat-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> 치트</span>
        <button id="cheat-fold" class="cheat-fold" type="button" aria-label="접기/펼치기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"/></svg></button>
      </div>
      <div class="cheat-body" id="cheat-body">
        <div class="cheat-row">
          <span class="cheat-label">속도</span>
          <div class="cheat-speed" id="cheat-speed">
            <button type="button" data-mul="1" class="on">×1</button>
            <button type="button" data-mul="2">×2</button>
            <button type="button" data-mul="4">×4</button>
            <button type="button" data-mul="8">×8</button>
          </div>
        </div>
        <label class="cheat-row cheat-toggle">
          <span class="cheat-label">안 죽기</span>
          <input type="checkbox" id="cheat-inv" />
        </label>
        <div class="cheat-row">
          <span class="cheat-label">드랍 확률</span>
          <input type="range" id="cheat-drop" min="0" max="100" value="11" />
          <b id="cheat-drop-val">11%</b>
        </div>
        <div class="cheat-row cheat-kinds">
          <span class="cheat-label">드랍 종류</span>
          <div class="cheat-kind-btns" id="cheat-kinds">
            <label><input type="checkbox" data-kind="P" checked /><span>P</span></label>
            <label><input type="checkbox" data-kind="S" checked /><span>S</span></label>
            <label><input type="checkbox" data-kind="E" checked /><span>E</span></label>
            <label><input type="checkbox" data-kind="T" checked /><span>T</span></label>
            <label><input type="checkbox" data-kind="H" checked /><span>H</span></label>
            <label><input type="checkbox" data-kind="B" checked /><span>B</span></label>
          </div>
        </div>
        <div class="cheat-row">
          <span class="cheat-label">여행 지도</span>
          <button type="button" id="cheat-map" class="cheat-btn">지도 열기</button>
        </div>
        <div class="cheat-row">
          <span class="cheat-label">보스</span>
          <button type="button" id="cheat-boss" class="cheat-btn">보스 소환</button>
        </div>
        <div class="cheat-row">
          <span class="cheat-label">무기</span>
          <button type="button" id="cheat-weapon" class="cheat-btn">강화 +1</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 세계 여행 지도(구역 클리어 후 다음 목적지 선택, docs/10). SVG·핀은 main.js가 채운다. -->
  <div id="map-overlay" class="map-overlay" hidden>
    <div class="map-panel" role="dialog" aria-label="세계 여행 지도">
      <button type="button" id="map-exit" class="map-exit home" aria-label="게임 나가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
      <div class="map-title" id="map-title">다음 목적지를 골라주세요</div>
      <div class="map-viewport" id="map-viewport"></div>
      <div class="map-controls">
        <button type="button" id="map-home" class="map-ctrl" aria-label="내 위치로">내 위치</button>
        <button type="button" id="map-zoom-in" class="map-ctrl map-ctrl-sq" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
        <button type="button" id="map-zoom-out" class="map-ctrl map-ctrl-sq" aria-label="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      </div>
      <div class="map-hint" id="map-hint">지도를 끌어 움직이고, 밝게 빛나는 도시를 눌러 여행을 떠나자</div>
      <div class="map-card" id="map-card" hidden></div>
    </div>
  </div>
</div>
<script type="module" src="../../shared/cloud/auto.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
