<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f7f9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="시뮬레이터" />
<link rel="icon" type="image/png" href="../../icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../../icons/icon-180.png" />
<link rel="manifest" href="app.webmanifest" />
<link rel="stylesheet" href="./styles/tokens.css" />
<link rel="stylesheet" href="./styles/app.css" />
<title>시뮬레이터</title>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a href="../../" class="icon-btn" aria-label="홈으로" title="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
    <button type="button" class="icon-btn list-toggle" id="list-toggle" aria-label="목록 접기" title="목록 접기" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <div class="seg tabs" role="tablist">
      <button type="button" role="tab" data-tab="compare" id="tab-compare">비교 차트</button>
      <button type="button" role="tab" data-tab="sim" id="tab-sim">시뮬레이터</button>
    </div>
    <div class="seg interval" id="interval" role="group" aria-label="기간 단위">
      <button type="button" data-interval="day">일간</button>
      <button type="button" data-interval="week">주간</button>
      <button type="button" data-interval="month">월간</button>
    </div>
    <label class="game-toggle"><input type="checkbox" id="game-mode" /><span>게임 모드</span></label>
    <div class="updated" id="updated"></div>
  </header>

  <main class="view" id="view-compare">
    <nav class="series-list" id="series-list" aria-label="시세 켜고 끄기"></nav>
    <div class="list-handle" id="list-handle" aria-hidden="true"></div>
    <section class="charts">
      <h2 class="sec-title" id="sec-compare"></h2>
      <div class="hover-date" id="hover-date"></div>
      <div class="chart price" id="chart-price"></div>
      <div class="chart rate" id="chart-rate"></div>
    </section>
  </main>

  <main class="view" id="view-sim" hidden>
    <nav class="series-list lab-list" id="lab-list" aria-label="전략 켜고 끄기"></nav>
    <div class="list-handle" id="lab-handle" aria-hidden="true"></div>
    <section class="lab-main" id="lab-main">
      <section class="sim-inputs lab-inputs">
        <div class="field"><span>기간</span><div class="seg" id="lab-period" role="group"></div></div>
        <div class="field"><span>직접 기간</span>
          <span class="input-unit date-range"><input type="date" id="lab-start" /><span>~</span><input type="date" id="lab-end" /></span>
        </div>
        <label class="field"><span id="lab-initial-lb">시작 금액</span>
          <span class="input-unit"><input type="number" id="lab-initial" inputmode="numeric" step="100" /><span id="lab-initial-unit">만 원</span></span>
        </label>
        <div class="field"><span>체결</span><div class="seg" id="lab-exec" role="group"></div></div>
        <div class="field"><span>비교 묶음</span><div class="seg" id="lab-group" role="group"></div></div>
      </section>
      <div class="lab-note" id="lab-note"></div>
      <h2 class="lab-h">결과</h2>
      <div class="table-wrap summary-wrap">
        <table class="summary lab-sum" id="lab-summary"><thead></thead><tbody></tbody></table>
      </div>
      <div class="chart-head"><div class="hover-date" id="lab-hover"></div><div class="legend" id="lab-legend"></div></div>
      <div class="chart equity" id="lab-chart"></div>
      <h2 class="lab-h">연도별 (해마다 시작 금액으로 새로 시작) · 2023 ~ 지금 이어서</h2>
      <div class="table-wrap summary-wrap">
        <table class="summary lab-years" id="lab-years"><thead></thead><tbody></tbody></table>
      </div>
      <h2 class="lab-h">고른 전략</h2>
      <section class="lab-detail" id="lab-detail"></section>
      <div class="lab-disclaimer">과거 자료로 계산한 모의 결과이며 앞으로의 수익을 뜻하지 않습니다.</div>
    </section>
  </main>
  <footer class="credit" id="credit" hidden>차트 라이브러리 <a href="https://www.tradingview.com/lightweight-charts/" target="_blank" rel="noopener">Lightweight Charts</a> (Apache-2.0)</footer>
</div>
<script src="./vendor/lightweight-charts.standalone.production.js"></script>
<script src="./vendor/side-panel.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
