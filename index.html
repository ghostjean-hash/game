<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f6fa" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ghost" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="shared/tokens.css" />
<link rel="stylesheet" href="shared/base.css" />
<link rel="stylesheet" href="shared/hub.css" />
<title>game_ghost</title>
</head>
<body>
<div class="page">
  <div id="cloud-slot" class="hub-cloud-slot"></div>
  <main class="launcher">

    <section class="hub-panel" id="sec-games" aria-label="게임 목록">
      <div id="grid-games" class="grid" aria-live="polite"></div>
    </section>

    <section class="hub-panel" id="sec-apps" aria-label="앱 목록" hidden>
      <div id="grid-apps" class="grid" aria-live="polite"></div>
    </section>

    <section class="hub-panel hub-info" id="footer" aria-label="정보" hidden>
      <p>게임과 학습 앱을 한곳에서 이어서 즐기세요.</p>
      <p class="hub-info-note">진행 기록은 이 기기에 저장됩니다.</p>
    </section>
  </main>
  <nav class="hub-dock" aria-label="허브 이동">
    <button class="is-active" type="button" data-hub-view="games">게임</button>
    <button type="button" data-hub-view="apps">앱</button>
    <button type="button" data-hub-view="info">정보</button>
  </nav>
</div>
<script type="module">
import { registerServiceWorker } from "./shared/ui.js";
import { bootCloud } from "./shared/cloud/boot.js";
registerServiceWorker("/service-worker.js");
bootCloud({ container: document.getElementById("cloud-slot") }).catch(() => {});



// 게임과 앱 두 구역을 각자의 등록부에서 읽어 같은 카드 UI로 렌더한다.
loadSection("./games/_registry.json", "games", "grid-games", "count-games", "sec-games");
loadSection("./apps/_registry.json", "apps", "grid-apps", "count-apps", "sec-apps");

const hubPanels = { games: document.getElementById("sec-games"), apps: document.getElementById("sec-apps"), info: document.getElementById("footer") };
const hubButtons = [...document.querySelectorAll("[data-hub-view]")];
function selectHubView(view) {
  const selected = hubPanels[view] ? view : "games";
  Object.entries(hubPanels).forEach(([name, panel]) => { panel.hidden = name !== selected; });
  hubButtons.forEach((button) => {
    const active = button.dataset.hubView === selected;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-current", active ? "page" : "false");
  });
  history.replaceState(null, "", `#${selected}`);
}
hubButtons.forEach((button) => button.addEventListener("click", () => selectHubView(button.dataset.hubView)));
selectHubView(location.hash.slice(1));

function loadSection(url, key, gridId, countId, sectionId) {
  const grid = document.getElementById(gridId);
  fetch(url, { cache: "no-cache" })
    .then((r) => r.json())
    .then((data) => render(data[key] || [], grid, document.getElementById(countId)))
    .catch(() => {
      grid.innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>';
    });
}

function render(items, grid, countEl) {
  if (!items.length) {
    grid.innerHTML = '<div class="empty">아직 등록된 항목이 없습니다.</div>';
    if (countEl) countEl.textContent = "0";
    return;
  }
  if (countEl) countEl.textContent = String(items.length);
  grid.innerHTML = "";
  for (const it of items) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = it.path;
    a.style.setProperty("--accent", it.accent || "var(--accent)");
    a.innerHTML = `
      <div class="accent-bar"></div>
      <div>
        <h3></h3>
        <div class="desc"></div>
      </div>
      <div class="meta">
        <span class="badge"></span>
      </div>
    `;
    a.querySelector("h3").textContent = it.title;
    a.querySelector(".desc").textContent = it.subtitle || "";
    const badge = a.querySelector(".badge");
    badge.textContent = it.status || "wip";
    badge.classList.add(it.status || "wip");
    grid.appendChild(a);
  }
}
</script>
</body>
</html>
