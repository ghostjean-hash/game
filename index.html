<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f6fa" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ghost" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="shared/tokens.css" />
<link rel="stylesheet" href="shared/base.css" />
<title>game_ghost</title>
<style>
  /* 홈화면만 라이트 테마(사용자 지시 2026-07-29). 게임·앱 화면은 기존 다크 유지.
     tokens.css를 링크한 뒤에 선언해 이 값이 이긴다. */
  :root {
    --bg: #f5f6fa;
    --bg-elev: #ffffff;
    --bg-elev-2: #eceff5;
    --fg: #1a1d26;
    --fg-dim: #5a6273;
    --fg-mute: #8b93a5;
    --accent: #0f9d70;
    --accent-strong: #0a7f5a;
    --warn: #b0761a;
    --danger: #d64560;
    --line: #dee2ec;
    --shadow-1: 0 1px 2px rgba(16,24,40,0.06), 0 2px 8px rgba(16,24,40,0.06);
    --shadow-2: 0 8px 24px rgba(16,24,40,0.14);
  }
  /* 밝은 배경에서 대비를 잃는 하드코딩 값 보정 */
  .modal-backdrop { background: rgba(26, 29, 38, 0.45); }
  .btn-primary { color: #ffffff; }

  .launcher {
    flex: 1;
    overflow-y: auto;
    padding: var(--sp-5) var(--sp-4) var(--sp-7);
  }
  .launcher header {
    margin-bottom: var(--sp-5);
  }
  .head-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sp-3);
  }
  /* 클라우드 저장 버튼 - 카드 배지와 같은 알약 모양·색 체계를 재사용한다. */
  .cloud-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px 5px 5px;
    border-radius: 999px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--fg-dim);
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background var(--dur-1) var(--ease);
  }
  .cloud-btn:hover { background: var(--bg-elev-2); }
  .cloud-btn:active { transform: scale(0.98); }
  .cloud-btn-dot {
    width: 20px;
    height: 20px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background-color: var(--bg-elev-2);
    background-size: cover;
    background-position: center;
    font-size: 11px;
    line-height: 1;
  }
  .cloud-btn[data-state="synced"] { color: var(--accent); border-color: rgba(15,157,112,0.35); }
  .cloud-btn[data-state="offline"],
  .cloud-btn[data-state="error"],
  .cloud-btn[data-state="conflict"],
  .cloud-btn[data-state="disabled"] { color: var(--warn); border-color: rgba(176,118,26,0.35); }
  /* 충돌 선택 대화상자(설계 4.7.3) */
  .cloud-conflict {
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
    text-align: left;
    margin: var(--sp-2) 0 var(--sp-3);
  }
  .cloud-conflict-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .cloud-conflict-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 5px 0;
    font-size: 13px;
    color: var(--fg-dim);
    cursor: pointer;
  }
  .cloud-conflict-row input { margin-top: 3px; }
  .cloud-conflict-row span { display: flex; flex-direction: column; gap: 2px; }
  .cloud-conflict-row b { font-weight: 700; color: var(--fg); }
  .cloud-conflict-when { font-size: 11px; color: var(--fg-mute); }
  .launcher h1 {
    margin: 0 0 var(--sp-2);
    font-size: 28px;
    letter-spacing: -0.5px;
  }
  .launcher .sub {
    color: var(--fg-dim);
    font-size: 14px;
  }
  .section { margin-bottom: var(--sp-6); }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: var(--sp-2);
    margin-bottom: var(--sp-3);
  }
  .section-head h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--fg);
  }
  .section-head .count {
    font-size: 12px;
    color: var(--fg-mute);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: var(--sp-3);
  }
  .card {
    position: relative;
    display: block;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--r-3);
    padding: var(--sp-4);
    color: inherit;
    text-decoration: none;
    transition: transform var(--dur-1) var(--ease), background var(--dur-1) var(--ease);
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  .card:hover { background: var(--bg-elev-2); }
  .card:active { transform: scale(0.98); }
  .card .accent-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
  }
  .card h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }
  .card .desc {
    color: var(--fg-dim);
    font-size: 13px;
    margin-top: var(--sp-1);
  }
  .card .meta {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    margin-top: var(--sp-3);
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--bg-elev-2);
    color: var(--fg-dim);
    border: 1px solid var(--line);
  }
  /* 배지는 카드마다 다른 강조색을 물려받으면 밝은 배경에서 흐려진다. 고정 색을 쓴다.
     카드 위쪽 색 띠(accent-bar)만 게임별 색을 유지한다. */
  .badge.playable { color: #0f9d70; border-color: rgba(15,157,112,0.35); background: rgba(15,157,112,0.08); }
  .badge.polished { color: #ffffff; background: #0f9d70; border-color: transparent; }
  .badge.wip { color: #9a6612; border-color: rgba(154,102,18,0.35); background: rgba(154,102,18,0.08); }
  .empty {
    text-align: center;
    color: var(--fg-mute);
    padding: var(--sp-7) var(--sp-4);
  }
  footer {
    margin-top: var(--sp-7);
    text-align: center;
    color: var(--fg-mute);
    font-size: 12px;
  }

  /* 허브 v2 — 목록이 아니라 하나의 앱 라이브러리처럼 읽히는 진입 화면. */
  body { background: radial-gradient(circle at 0 0, #d9f8eb 0, transparent 32%), linear-gradient(180deg, #f8fbfd 0%, #edf3f8 100%); }
  .page { min-height: 100dvh; background: linear-gradient(90deg, rgba(255,255,255,.28), transparent 24%, transparent 76%, rgba(255,255,255,.28)); }
  .launcher { width: min(1120px, 100%); margin: 0 auto; padding: clamp(28px, 6vw, 72px) clamp(20px, 5vw, 56px) 56px; }
  .launcher header { position: relative; overflow: hidden; margin-bottom: clamp(28px, 4vw, 48px); padding: clamp(24px, 5vw, 46px); border: 1px solid rgba(15,157,112,.16); border-radius: 28px; background: linear-gradient(135deg, #ffffff 0%, #f0fbf6 100%); box-shadow: 0 20px 54px rgba(23, 53, 71, .12); }
  .launcher header::after { content: ''; position: absolute; width: 240px; height: 240px; right: -84px; bottom: -126px; border-radius: 50%; background: radial-gradient(circle, rgba(51, 196, 135, .24), rgba(51, 196, 135, 0) 68%); pointer-events: none; }
  .head-row { position: relative; z-index: 1; align-items: center; }
  .launcher h1 { margin-bottom: 8px; font-size: clamp(32px, 5vw, 48px); letter-spacing: -.06em; }
  .launcher .sub { max-width: 28ch; font-size: 15px; line-height: 1.6; }
  .section { margin-bottom: clamp(34px, 5vw, 58px); }
  .section-head { margin: 0 2px 14px; }
  .section-head h2 { font-size: 17px; letter-spacing: -.02em; }
  .section-head .count { display: grid; place-items: center; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: rgba(26,29,38,.06); font-weight: 700; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .card { min-height: 208px; aspect-ratio: auto; padding: 22px; border-radius: 20px; border-color: rgba(26,29,38,.08); box-shadow: 0 6px 20px rgba(21, 38, 55, .07); isolation: isolate; }
  .card::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 12%, transparent), transparent 48%); opacity: .9; }
  .card:hover { transform: translateY(-4px); background: #fff; box-shadow: 0 18px 30px rgba(21,38,55,.14); }
  .card h3 { font-size: 20px; letter-spacing: -.035em; }
  .card .desc { margin-top: 7px; line-height: 1.55; }
  .card .meta { margin-top: auto; }
  .card .accent-bar { height: 5px; }
  .badge { padding: 5px 10px; font-size: 10px; }
  @media (max-width: 560px) { .launcher { padding: 20px 16px 40px; } .launcher header { border-radius: 22px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .card { min-height: 176px; padding: 16px; border-radius: 16px; } .card h3 { font-size: 17px; } .card .desc { font-size: 12px; } }
  .hub-dock { position: sticky; bottom: 12px; z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: min(360px, calc(100% - 20px)); margin: 18px auto 0; padding: 6px; border: 1px solid rgba(26,29,38,.12); border-radius: 18px; background: rgba(255,255,255,.88); box-shadow: 0 14px 34px rgba(26,40,55,.18); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .hub-dock a { display: grid; place-items: center; min-height: 40px; border-radius: 12px; color: var(--fg-dim); font-size: 13px; font-weight: 800; }
  .hub-dock a:hover, .hub-dock a.is-active { color: #fff; background: var(--accent); }

  /* 허브 탭: 하단 바의 항목 하나만 보인다. 목록 안에서 같은 이름을 다시 반복하지 않는다. */
  .launcher { padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px)); }
  .hub-panel { margin: 0; }
  .hub-panel[hidden] { display: none; }
  .hub-info { max-width: 560px; padding: 28px; border: 1px solid rgba(26,29,38,.09); border-radius: 20px; background: rgba(255,255,255,.72); box-shadow: var(--shadow-1); }
  .hub-info p { margin: 0; font-size: 16px; line-height: 1.65; color: var(--fg-dim); }
  .hub-info .hub-info-note { margin-top: 10px; font-size: 13px; color: var(--fg-mute); }
  .hub-dock { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); margin: 0; }
  .hub-dock button { min-height: 40px; border: 0; border-radius: 12px; background: transparent; color: var(--fg-dim); font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
  .hub-dock button:hover, .hub-dock button.is-active { color: #fff; background: var(--accent); }
  @media (max-width: 560px) { .launcher { padding-bottom: calc(98px + env(safe-area-inset-bottom, 0px)); } .hub-info { padding: 22px; } }

  /* 허브 v3: 제목 카드 없이 바로 목록으로 들어가는 어두운 라이브러리. */
  :root { --bg: #101216; --bg-elev: #181b22; --bg-elev-2: #232733; --fg: #f5f7fb; --fg-dim: #b6bdca; --fg-mute: #7f8797; --line: #2b303b; --accent: #7cf3c4; --accent-strong: #53d9a7; }
  body, .page { background: #101216; }
  .page { min-height: 100dvh; }
  .launcher { width: min(1160px, 100%); margin: 0 auto; padding: 24px 24px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .launcher header { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card { min-height: 174px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-elev); box-shadow: none; }
  .card::before { display: none; }
  .card:hover { transform: translateY(-2px); background: #1d212a; box-shadow: none; }
  .card .accent-bar { top: 14px; bottom: 14px; left: 0; right: auto; width: 4px; height: auto; border-radius: 0 4px 4px 0; }
  .card h3 { font-size: 19px; color: var(--fg); }
  .card .desc { color: var(--fg-dim); font-size: 13px; }
  .badge { background: transparent; color: var(--fg-mute); border-color: #39404d; }
  .hub-info { max-width: none; border-color: var(--line); border-radius: 14px; background: var(--bg-elev); box-shadow: none; }
  .hub-info p { color: var(--fg-dim); }
  .hub-dock { position: fixed; left: 0; right: 0; bottom: 0; transform: none; width: 100%; height: calc(64px + env(safe-area-inset-bottom, 0px)); margin: 0; padding: 0 8px env(safe-area-inset-bottom, 0px); border: 0; border-top: 1px solid #303642; border-radius: 0; background: #161920; box-shadow: 0 -10px 30px rgba(0,0,0,.26); backdrop-filter: none; }
  .hub-dock button { min-height: 56px; border-radius: 0; color: var(--fg-mute); }
  .hub-dock button:hover, .hub-dock button.is-active { color: var(--accent); background: transparent; box-shadow: inset 0 3px 0 var(--accent); }
  @media (max-width: 560px) { .launcher { padding: 16px 14px calc(88px + env(safe-area-inset-bottom, 0px)); } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; } .card { min-height: 154px; padding: 15px; border-radius: 12px; } .card h3 { font-size: 16px; } }

  /* 사용자 결정: 허브는 라이트 테마이며 카드 위·왼쪽 어느 곳에도 색 띠를 두지 않는다. */
  :root { --bg: #f5f6fa; --bg-elev: #ffffff; --bg-elev-2: #eceff5; --fg: #1a1d26; --fg-dim: #5a6273; --fg-mute: #8b93a5; --line: #dee2ec; --accent: #0f9d70; --accent-strong: #0a7f5a; }
  body, .page { background: #f5f6fa; }
  .card { background: #ffffff; border-color: #dee2ec; }
  .card:hover { background: #ffffff; box-shadow: 0 8px 20px rgba(16,24,40,.08); }
  .card::before, .card .accent-bar { display: none; }
  .card h3 { color: #1a1d26; }
  .card .desc { color: #5a6273; }
  .badge { color: #5a6273; border-color: #dee2ec; background: #f5f6fa; }
  .hub-info { background: #ffffff; border-color: #dee2ec; }
  .hub-info p { color: #5a6273; }
  .hub-dock { border-top-color: #dee2ec; background: #ffffff; box-shadow: 0 -8px 22px rgba(16,24,40,.08); }
  .hub-dock button { color: #697386; }
  .hub-dock button:hover, .hub-dock button.is-active { color: #0a7f5a; background: #f0fbf6; box-shadow: inset 0 3px 0 #0f9d70; }

  /* 로그인·클라우드 저장은 허브 기능이다. 제목 카드와 무관하게 독립 조작으로 둔다. */
  .hub-cloud-slot { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; z-index: 30; }
  .hub-cloud-slot .cloud-btn { background: rgba(255,255,255,.94); box-shadow: 0 4px 12px rgba(16,24,40,.10); }
</style>
</head>
<body>
<div class="page">
  <div id="cloud-slot" class="hub-cloud-slot"></div>
  <main class="launcher">

    <section class="hub-panel" id="sec-games" aria-label="게임 목록">
      <div id="grid-games" class="grid" aria-live="polite"></div>
    </section>

    <section class="hub-panel" id="sec-apps" aria-label="앱 목록" hidden>
      <div id="grid-apps" class="grid" aria-live="polite"></div>
    </section>

    <section class="hub-panel hub-info" id="footer" aria-label="정보" hidden>
      <p>게임과 학습 앱을 한곳에서 이어서 즐기세요.</p>
      <p class="hub-info-note">진행 기록은 이 기기에 저장됩니다.</p>
    </section>
  </main>
  <nav class="hub-dock" aria-label="허브 이동">
    <button class="is-active" type="button" data-hub-view="games">게임</button>
    <button type="button" data-hub-view="apps">앱</button>
    <button type="button" data-hub-view="info">정보</button>
  </nav>
</div>
<script type="module">
import { registerServiceWorker } from "./shared/ui.js";
import { bootCloud } from "./shared/cloud/boot.js";
registerServiceWorker("/service-worker.js");
bootCloud({ container: document.getElementById("cloud-slot") }).catch(() => {});



// 게임과 앱 두 구역을 각자의 등록부에서 읽어 같은 카드 UI로 렌더한다.
loadSection("./games/_registry.json", "games", "grid-games", "count-games", "sec-games");
loadSection("./apps/_registry.json", "apps", "grid-apps", "count-apps", "sec-apps");

const hubPanels = { games: document.getElementById("sec-games"), apps: document.getElementById("sec-apps"), info: document.getElementById("footer") };
const hubButtons = [...document.querySelectorAll("[data-hub-view]")];
function selectHubView(view) {
  const selected = hubPanels[view] ? view : "games";
  Object.entries(hubPanels).forEach(([name, panel]) => { panel.hidden = name !== selected; });
  hubButtons.forEach((button) => {
    const active = button.dataset.hubView === selected;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-current", active ? "page" : "false");
  });
  history.replaceState(null, "", `#${selected}`);
}
hubButtons.forEach((button) => button.addEventListener("click", () => selectHubView(button.dataset.hubView)));
selectHubView(location.hash.slice(1));

function loadSection(url, key, gridId, countId, sectionId) {
  const grid = document.getElementById(gridId);
  fetch(url, { cache: "no-cache" })
    .then((r) => r.json())
    .then((data) => render(data[key] || [], grid, document.getElementById(countId)))
    .catch(() => {
      grid.innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>';
    });
}

function render(items, grid, countEl) {
  if (!items.length) {
    grid.innerHTML = '<div class="empty">아직 등록된 항목이 없습니다.</div>';
    if (countEl) countEl.textContent = "0";
    return;
  }
  if (countEl) countEl.textContent = String(items.length);
  grid.innerHTML = "";
  for (const it of items) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = it.path;
    a.style.setProperty("--accent", it.accent || "var(--accent)");
    a.innerHTML = `
      <div class="accent-bar"></div>
      <div>
        <h3></h3>
        <div class="desc"></div>
      </div>
      <div class="meta">
        <span class="badge"></span>
      </div>
    `;
    a.querySelector("h3").textContent = it.title;
    a.querySelector(".desc").textContent = it.subtitle || "";
    const badge = a.querySelector(".badge");
    badge.textContent = it.status || "wip";
    badge.classList.add(it.status || "wip");
    grid.appendChild(a);
  }
}
</script>
</body>
</html>
