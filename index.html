<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f6fa" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ghost" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="shared/tokens.css" />
<link rel="stylesheet" href="shared/base.css" />
<title>game_ghost</title>
<style>
  /* 홈화면만 라이트 테마(사용자 지시 2026-07-29). 게임·앱 화면은 기존 다크 유지.
     tokens.css를 링크한 뒤에 선언해 이 값이 이긴다. */
  :root {
    --bg: #f5f6fa;
    --bg-elev: #ffffff;
    --bg-elev-2: #eceff5;
    --fg: #1a1d26;
    --fg-dim: #5a6273;
    --fg-mute: #8b93a5;
    --accent: #0f9d70;
    --accent-strong: #0a7f5a;
    --warn: #b0761a;
    --danger: #d64560;
    --line: #dee2ec;
    --shadow-1: 0 1px 2px rgba(16,24,40,0.06), 0 2px 8px rgba(16,24,40,0.06);
    --shadow-2: 0 8px 24px rgba(16,24,40,0.14);
  }
  /* 밝은 배경에서 대비를 잃는 하드코딩 값 보정 */
  .modal-backdrop { background: rgba(26, 29, 38, 0.45); }
  .btn-primary { color: #ffffff; }

  .launcher {
    flex: 1;
    overflow-y: auto;
    padding: var(--sp-5) var(--sp-4) var(--sp-7);
  }
  .launcher header {
    margin-bottom: var(--sp-5);
  }
  .head-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sp-3);
  }
  /* 클라우드 저장 버튼 - 카드 배지와 같은 알약 모양·색 체계를 재사용한다. */
  .cloud-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px 5px 5px;
    border-radius: 999px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--fg-dim);
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background var(--dur-1) var(--ease);
  }
  .cloud-btn:hover { background: var(--bg-elev-2); }
  .cloud-btn:active { transform: scale(0.98); }
  .cloud-btn-dot {
    width: 20px;
    height: 20px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background-color: var(--bg-elev-2);
    background-size: cover;
    background-position: center;
    font-size: 11px;
    line-height: 1;
  }
  .cloud-btn[data-state="synced"] { color: var(--accent); border-color: rgba(15,157,112,0.35); }
  .cloud-btn[data-state="offline"],
  .cloud-btn[data-state="error"],
  .cloud-btn[data-state="conflict"],
  .cloud-btn[data-state="disabled"] { color: var(--warn); border-color: rgba(176,118,26,0.35); }
  /* 충돌 선택 대화상자(설계 4.7.3) */
  .cloud-conflict {
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
    text-align: left;
    margin: var(--sp-2) 0 var(--sp-3);
  }
  .cloud-conflict-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .cloud-conflict-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 5px 0;
    font-size: 13px;
    color: var(--fg-dim);
    cursor: pointer;
  }
  .cloud-conflict-row input { margin-top: 3px; }
  .cloud-conflict-row span { display: flex; flex-direction: column; gap: 2px; }
  .cloud-conflict-row b { font-weight: 700; color: var(--fg); }
  .cloud-conflict-when { font-size: 11px; color: var(--fg-mute); }
  .launcher h1 {
    margin: 0 0 var(--sp-2);
    font-size: 28px;
    letter-spacing: -0.5px;
  }
  .launcher .sub {
    color: var(--fg-dim);
    font-size: 14px;
  }
  .section { margin-bottom: var(--sp-6); }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: var(--sp-2);
    margin-bottom: var(--sp-3);
  }
  .section-head h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--fg);
  }
  .section-head .count {
    font-size: 12px;
    color: var(--fg-mute);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: var(--sp-3);
  }
  .card {
    position: relative;
    display: block;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--r-3);
    padding: var(--sp-4);
    color: inherit;
    text-decoration: none;
    transition: transform var(--dur-1) var(--ease), background var(--dur-1) var(--ease);
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  .card:hover { background: var(--bg-elev-2); }
  .card:active { transform: scale(0.98); }
  .card .accent-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
  }
  .card h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }
  .card .desc {
    color: var(--fg-dim);
    font-size: 13px;
    margin-top: var(--sp-1);
  }
  .card .meta {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    margin-top: var(--sp-3);
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--bg-elev-2);
    color: var(--fg-dim);
    border: 1px solid var(--line);
  }
  /* 배지는 카드마다 다른 강조색을 물려받으면 밝은 배경에서 흐려진다. 고정 색을 쓴다.
     카드 위쪽 색 띠(accent-bar)만 게임별 색을 유지한다. */
  .badge.playable { color: #0f9d70; border-color: rgba(15,157,112,0.35); background: rgba(15,157,112,0.08); }
  .badge.polished { color: #ffffff; background: #0f9d70; border-color: transparent; }
  .badge.wip { color: #9a6612; border-color: rgba(154,102,18,0.35); background: rgba(154,102,18,0.08); }
  .empty {
    text-align: center;
    color: var(--fg-mute);
    padding: var(--sp-7) var(--sp-4);
  }
  footer {
    margin-top: var(--sp-7);
    text-align: center;
    color: var(--fg-mute);
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="page">
  <main class="launcher">
    <header>
      <div class="head-row">
        <div>
          <h1>game_ghost</h1>
          <div class="sub">미니 게임 · 앱 모음</div>
        </div>
        <div id="cloud-slot"></div>
      </div>
    </header>

    <section class="section" id="sec-games">
      <div class="section-head">
        <h2>게임</h2>
        <span class="count" id="count-games"></span>
      </div>
      <div id="grid-games" class="grid" aria-live="polite"></div>
    </section>

    <section class="section" id="sec-apps">
      <div class="section-head">
        <h2>앱</h2>
        <span class="count" id="count-apps"></span>
      </div>
      <div id="grid-apps" class="grid" aria-live="polite"></div>
    </section>

    <footer id="footer"></footer>
  </main>
</div>
<script type="module">
import { registerServiceWorker } from "./shared/ui.js";
import { bootCloud } from "./shared/cloud/boot.js";
import { isFullscreenSupported, isStandaloneDisplay, showHomeScreenHint } from "./shared/fullscreen.js";
registerServiceWorker("/service-worker.js");

// 아이폰은 애플이 동영상 외 전체화면을 열지 않아 게임 화면의 전체화면 버튼이 통하지 않는다.
// 그 기기에서 유일하게 통하는 길(홈 화면에 추가)을 첫 방문 1회 알려준다. 닫으면 다시 뜨지 않고,
// 게임 화면에서는 전체화면 버튼을 눌러 언제든 다시 볼 수 있다.
if (!isStandaloneDisplay() && !isFullscreenSupported()) showHomeScreenHint({ once: true });

// 클라우드 저장 버튼. 준비되지 않았으면 아무것도 그리지 않는다(shared/cloud/boot.js).
// 실패해도 허브 목록 렌더에 영향을 주지 않는다.
bootCloud({ container: document.getElementById("cloud-slot") }).catch(() => {});

// 게임과 앱 두 구역을 각자의 등록부에서 읽어 같은 카드 UI로 렌더한다.
loadSection("./games/_registry.json", "games", "grid-games", "count-games", "sec-games");
loadSection("./apps/_registry.json", "apps", "grid-apps", "count-apps", "sec-apps");

function loadSection(url, key, gridId, countId, sectionId) {
  const grid = document.getElementById(gridId);
  fetch(url, { cache: "no-cache" })
    .then((r) => r.json())
    .then((data) => render(data[key] || [], grid, document.getElementById(countId)))
    .catch(() => {
      grid.innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>';
    });
}

function render(items, grid, countEl) {
  if (!items.length) {
    grid.innerHTML = '<div class="empty">아직 등록된 항목이 없습니다.</div>';
    if (countEl) countEl.textContent = "0";
    return;
  }
  if (countEl) countEl.textContent = String(items.length);
  grid.innerHTML = "";
  for (const it of items) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = it.path;
    a.style.setProperty("--accent", it.accent || "var(--accent)");
    a.innerHTML = `
      <div class="accent-bar"></div>
      <div>
        <h3></h3>
        <div class="desc"></div>
      </div>
      <div class="meta">
        <span class="badge"></span>
      </div>
    `;
    a.querySelector("h3").textContent = it.title;
    a.querySelector(".desc").textContent = it.subtitle || "";
    const badge = a.querySelector(".badge");
    badge.textContent = it.status || "wip";
    badge.classList.add(it.status || "wip");
    grid.appendChild(a);
  }
}
</script>
</body>
</html>
